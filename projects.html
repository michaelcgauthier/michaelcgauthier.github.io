  <link rel="stylesheet" href="styles.css?v=99" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brandblock">
        <div class="brand">Michael Gauthier</div>
        <div class="subtitle">Mechanical Engineering Student</div>
      </div>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="projects.html">Projects</a>
        <a class="nav-link" href="resume.html">Resume</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="contact.html">Contact</a>
        <a class="icon-link" href="mailto:gauthier.mi@northeastern.edu" aria-label="Email">✉</a>
        <a class="icon-link" href="https://www.linkedin.com/in/mgauthier1" target="_blank" rel="noopener" aria-label="LinkedIn">in</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero thin" style="background-image:url('assets/images/ProjectBanner.jpg'); background-size:cover; background-repeat:no-repeat; background-position:center 35%;">
      <div class="hero-overlay"></div>
      <div class="wrap hero-content">
        <div class="hero-center">
          <h1 class="hero-title" style="font-size: clamp(30px, 4.2vw, 52px);">Engineering Projects</h1>
        </div>
      </div>
    </section>

    <section class="surface">
      <div class="wrap section">
        <div id="projectsGrid" class="projects-grid"></div>

        <footer class="footer">
          <div class="wrap footer-3">
            <div class="footer-left">
              <a href="mailto:gauthier.mi@northeastern.edu">gauthier.mi@northeastern.edu</a>
              <span class="sep">|</span>
              <a href="https://www.linkedin.com/in/mgauthier1" target="_blank" rel="noopener">LinkedIn</a>
            </div>
            <div class="footer-center">Michael Gauthier Engineering Portfolio</div>
            <div class="footer-right">© <span id="year"></span></div>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="projects-data.js?v=99"></script>
  <script src="script.js?v=99"></script>
  <script>
    const grid = document.getElementById("projectsGrid");
    const items = (window.PROJECTS || []).slice().sort((a,b)=>a.number-b.number);

    grid.innerHTML = items.map(p => `
      <a class="project-card" href="project.html?slug=${encodeURIComponent(p.slug)}">
        <div class="project-thumb" style="background-image:url('${p.thumb}')"></div>
        <div class="project-body">
          <h3>${p.number}. ${p.title}</h3>
          <p>${p.preview || (p.subsections && p.subsections[0] ? p.subsections[0].preview : "")}</p>
          <div class="readmore">Read more</div>
        </div>
      </a>
    `).join("");
  </script>
</body>
</html>
