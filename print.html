<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PDF Portfolio | Michael Gauthier</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root{
      --ink:#0b1220;
      --muted:#475569;
      --soft:#f5f7fb;
      --soft2:#eef3f8;
      --blue:#1d4ed8;
      --deep:#0f172a;
      --white:#ffffff;
      --shadow:0 18px 45px rgba(2,8,23,.12);
      --radius:20px;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      padding:0;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:#dfe6ee;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    body{
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .pdf-actions{
      position:fixed;
      top:18px;
      right:18px;
      z-index:9999;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .pdf-actions a,
    .pdf-actions button{
      appearance:none;
      border:0;
      outline:none;
      cursor:pointer;
      padding:12px 16px;
      border-radius:999px;
      font-weight:900;
      font-size:13px;
      letter-spacing:.2px;
      color:#fff;
      background:#0f172a;
      box-shadow:0 12px 24px rgba(2,8,23,.20);
      font-family:inherit;
    }

    .pdf-actions a{
      background:#334155;
    }

    .pdf-actions button:hover,
    .pdf-actions a:hover{
      transform:translateY(-1px);
    }

    #pdfPortfolio{
      width:11.69in;
      margin:0 auto;
      background:#fff;
    }

    .page{
      width:11.69in;
      height:8.27in;
      position:relative;
      overflow:hidden;
      background:#ffffff;
      page-break-after:always;
      break-after:page;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:.38in .44in;
    }

    .page:last-child{
      page-break-after:auto;
      break-after:auto;
    }

    .page.full-bg{
      padding:0;
      color:#fff;
    }

    .page-bg-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      z-index:0;
    }

    .page-bg-overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(2,8,23,.72), rgba(2,8,23,.42), rgba(2,8,23,.68));
      z-index:1;
    }

    .page-content{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .cover-grid{
      width:100%;
      display:grid;
      grid-template-columns:335px 1fr;
      gap:42px;
      align-items:center;
      padding:0 .18in;
    }

    .cover-headshot{
      width:325px;
      height:430px;
      object-fit:cover;
      object-position:center 16%;
      border-radius:26px;
      box-shadow:0 24px 70px rgba(0,0,0,.38);
      background:#fff;
    }

    .cover-kicker{
      font-size:14px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      opacity:.9;
      margin-bottom:12px;
    }

    .cover-title{
      font-size:62px;
      line-height:.96;
      letter-spacing:-2.4px;
      font-weight:950;
      margin:0 0 12px;
    }

    .cover-subtitle{
      font-size:21.5px;
      line-height:1.35;
      font-weight:800;
      max-width:720px;
      margin:0 0 18px;
      color:rgba(255,255,255,.92);
    }

    .cover-blurb{
      font-size:15.2px;
      line-height:1.62;
      color:rgba(255,255,255,.98);
      max-width:760px;
      background:rgba(15,23,42,.58);
      border-radius:22px;
      padding:22px 24px;
      box-shadow:0 22px 75px rgba(0,0,0,.36);
      backdrop-filter:blur(12px);
    }

    .cover-meta{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
      color:#fff;
      font-size:12px;
      font-weight:800;
    }

    .cover-meta span{
      background:rgba(255,255,255,.18);
      border-radius:999px;
      padding:8px 13px;
      font-size:12.3px;
    }

    .section-title{
      font-size:36px;
      line-height:1;
      letter-spacing:-1.2px;
      font-weight:950;
      margin:0;
      text-align:center;
      color:var(--deep);
    }

    .section-subtitle{
      font-size:13.5px;
      line-height:1.55;
      color:var(--muted);
      text-align:center;
      max-width:760px;
      margin:12px auto 0;
      font-weight:600;
    }

    .index-wrap{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .index-list{
      margin-top:24px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px 16px;
    }

    .index-link{
      display:grid;
      grid-template-columns:42px 1fr;
      align-items:center;
      gap:10px;
      background:#f8fafc;
      border-radius:14px;
      padding:9px 12px;
      color:var(--ink);
      box-shadow:0 5px 16px rgba(2,8,23,.045);
      min-height:40px;
    }

    .index-num{
      width:32px;
      height:26px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:950;
      color:#fff;
      background:#0f172a;
    }

    .index-title{
      font-size:11.7px;
      line-height:1.22;
      font-weight:850;
      letter-spacing:-.1px;
    }

    .timeline-wrap{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .timeline-grid{
      margin-top:20px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px 15px;
    }

    .timeline-item{
      display:grid;
      grid-template-columns:58px 1fr;
      gap:11px;
      align-items:center;
      background:#f8fafc;
      border-radius:16px;
      padding:9px 11px;
      min-height:64px;
      box-shadow:0 7px 18px rgba(2,8,23,.055);
    }

    .timeline-item img{
      width:58px;
      height:47px;
      object-fit:contain;
      object-position:center;
      border-radius:11px;
      background:#fff;
      padding:2px;
    }

    .timeline-title{
      font-size:12px;
      line-height:1.18;
      font-weight:950;
      color:var(--ink);
      letter-spacing:-.12px;
    }

    .timeline-company{
      font-size:10.3px;
      line-height:1.2;
      font-weight:750;
      color:var(--muted);
      margin-top:2px;
    }

    .timeline-date{
      font-size:9.8px;
      line-height:1.2;
      font-weight:900;
      color:#2563eb;
      margin-top:3px;
    }

    .project-page{
      justify-content:flex-start;
      align-items:stretch;
      padding:.25in .34in .27in;
      background:linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
    }

    .project-header{
      text-align:center;
      margin:0 auto 10px;
      width:100%;
    }

    .project-number{
      font-size:11.5px;
      font-weight:950;
      color:#2563eb;
      text-transform:uppercase;
      letter-spacing:.16em;
      margin-bottom:5px;
    }

    .project-title{
      font-size:25px;
      line-height:1.08;
      letter-spacing:-.8px;
      font-weight:950;
      color:#0f172a;
      margin:0 auto 6px;
      max-width:10.2in;
    }

    .skill-row{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:5px;
      margin:13px auto 12px;
      max-height:36px;
      overflow:hidden;
    }

    .skill-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#eaf1ff;
      color:#1e3a8a;
      font-size:8.9px;
      line-height:1;
      font-weight:850;
      padding:5px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    .text-box{
      background:#ffffff;
      border-radius:18px;
      padding:15px 17px;
      box-shadow:0 10px 28px rgba(2,8,23,.065);
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .label{
      font-size:12.2px;
      font-weight:950;
      color:#0f172a;
      text-transform:uppercase;
      letter-spacing:.12em;
      margin-bottom:7px;
    }

    .body-text{
      font-size:12.35px;
      line-height:1.48;
      color:#263445;
      font-weight:570;
    }

    .text-section + .text-section{
      margin-top:13px;
    }

    .project-img-box{
      width:100%;
      background:#ffffff;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 28px rgba(2,8,23,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:5px;
    }

    .project-img-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
      display:block;
      border-radius:12px;
      background:#fff;
    }

    .project-main{
      display:grid;
      grid-template-columns:1fr 3.85in;
      gap:18px;
      align-items:stretch;
      width:100%;
    }

    .project-lower{
      display:grid;
      grid-template-columns:3.85in 1fr;
      gap:18px;
      align-items:stretch;
      margin-top:14px;
      width:100%;
    }

    .project-main .project-img-box,
    .project-lower .project-img-box{
      min-height:2.42in;
      max-height:2.63in;
      height:100%;
    }

    .project-main .project-img-box img,
    .project-lower .project-img-box img{
      max-height:2.50in;
    }

    .project-main-stacked{
      display:grid;
      grid-template-columns:1fr 3.85in;
      gap:18px;
      align-items:stretch;
      width:100%;
    }

    .project-lower-stacked{
      display:grid;
      grid-template-columns:3.85in 1fr;
      gap:18px;
      align-items:stretch;
      margin-top:14px;
      width:100%;
    }

    .image-stack{
      display:grid;
      grid-template-rows:1fr 1fr;
      gap:10px;
      height:3.08in;
    }

    .image-stack .project-img-box{
      min-height:1.49in;
      max-height:1.49in;
      height:1.49in;
      padding:5px;
    }

    .image-stack .project-img-box img{
      max-height:1.38in;
    }

    .single-image-tall{
      height:3.08in;
      min-height:3.08in;
      max-height:3.08in;
    }

    .single-image-tall img{
      max-height:2.96in;
    }

    .project-main-stacked .text-box,
    .project-lower-stacked .text-box{
      min-height:3.08in;
    }

    .project-1 .project-main-special{
      display:grid;
      grid-template-columns:1fr 3.15in;
      gap:18px;
      align-items:stretch;
      width:100%;
    }

    .project-1 .project-lower-special{
      display:grid;
      grid-template-columns:3.25in 1fr;
      gap:18px;
      align-items:stretch;
      margin-top:14px;
      width:100%;
    }

    .project-1 .project-main-special .text-box,
    .project-1 .project-main-special .project-img-box{
      min-height:3.20in;
      height:3.20in;
      max-height:3.20in;
    }

    .project-1 .project-main-special .project-img-box img{
      object-fit:contain;
      max-height:3.08in;
    }

    .project-1 .project-lower-special .text-box,
    .project-1 .project-lower-special .side-mini-stack{
      min-height:2.42in;
      height:2.42in;
      max-height:2.42in;
    }

    .project-1 .side-mini-stack{
      display:grid;
      grid-template-rows:1fr 1fr;
      gap:10px;
    }

    .project-1 .side-mini-stack .project-img-box{
      min-height:1.16in;
      height:1.16in;
      max-height:1.16in;
      padding:4px;
    }

    .project-1 .side-mini-stack .project-img-box img{
      max-height:1.08in;
      object-fit:contain;
    }

    .project-2 .image-stack{
      height:3.16in;
    }

    .project-2 .image-stack .project-img-box{
      min-height:1.53in;
      height:1.53in;
      max-height:1.53in;
      padding:3px;
    }

    .project-2 .image-stack .project-img-box img{
      object-fit:cover;
      max-height:1.47in;
    }

    .project-2 .single-image-tall img{
      object-fit:cover;
    }

    .project-4 .project-4-lower{
      display:grid;
      grid-template-columns:5.45in 1fr;
      gap:16px;
      align-items:stretch;
      margin-top:14px;
      width:100%;
    }

    .project-4 .side-by-side-images{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      height:2.58in;
    }

    .project-4 .side-by-side-images .project-img-box{
      min-height:2.58in;
      height:2.58in;
      max-height:2.58in;
      padding:4px;
    }

    .project-4 .side-by-side-images .project-img-box img{
      max-height:2.48in;
      object-fit:cover;
    }

    .project-4 .project-4-lower .text-box{
      min-height:2.58in;
      height:2.58in;
      max-height:2.58in;
    }

    .project-6 .project-main-stacked{
      grid-template-columns:1fr 3.95in;
    }

    .project-6 .image-stack{
      height:3.24in;
    }

    .project-6 .image-stack .project-img-box{
      min-height:1.57in;
      height:1.57in;
      max-height:1.57in;
      padding:4px;
    }

    .project-6 .image-stack .project-img-box img{
      max-height:1.48in;
    }

    .project-6 .project-main-stacked .text-box{
      min-height:3.24in;
      height:3.24in;
      max-height:3.24in;
    }

    .project-6 .project-lower-stacked{
      grid-template-columns:3.50in 1fr;
      margin-top:12px;
    }

    .project-6 .project-lower-stacked .text-box,
    .project-6 .project-lower-stacked .project-img-box{
      min-height:2.30in;
      height:2.30in;
      max-height:2.30in;
    }

    .project-6 .project-lower-stacked .project-img-box img{
      max-height:2.18in;
      object-fit:contain;
    }

    .project-7 .project-main-stacked{
      grid-template-columns:1fr 4.05in;
    }

    .project-7 .project-main-stacked .text-box{
      min-height:3.05in;
      height:3.05in;
      max-height:3.05in;
    }

    .project-7 .image-stack{
      height:3.05in;
    }

    .project-7 .image-stack .project-img-box{
      min-height:1.47in;
      height:1.47in;
      max-height:1.47in;
      padding:4px;
    }

    .project-7 .image-stack .project-img-box img{
      max-height:1.38in;
    }

    .project-7 .project-7-lower{
      display:grid;
      grid-template-columns:2.75in 1fr 2.75in;
      gap:14px;
      align-items:stretch;
      margin-top:14px;
      width:100%;
    }

    .project-7 .project-7-lower .text-box,
    .project-7 .project-7-lower .project-img-box{
      min-height:2.72in;
      height:2.72in;
      max-height:2.72in;
    }

    .project-7 .project-7-lower .project-img-box img{
      max-height:2.60in;
    }

    .project-12 .project-main{
      grid-template-columns:1fr 4.05in;
    }

    .project-12 .project-lower{
      grid-template-columns:4.05in 1fr;
    }

    .project-12 .project-main .project-img-box,
    .project-12 .project-lower .project-img-box{
      min-height:2.58in;
      height:2.58in;
      max-height:2.58in;
      padding:4px;
    }

    .project-12 .project-main .project-img-box img,
    .project-12 .project-lower .project-img-box img{
      max-height:2.50in;
      object-fit:cover;
      object-position:center;
    }

    .text-only-project{
      height:100%;
      width:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:16px;
    }

    .text-only-grid{
      width:9.8in;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:stretch;
    }

    .text-only-grid .text-box{
      min-height:2.35in;
      justify-content:flex-start;
    }

    .text-only-results{
      width:9.8in;
    }

    .text-only-project .body-text{
      font-size:12.5px;
      line-height:1.52;
    }

    .website-video-note{
      width:9.8in;
      background:#eaf1ff;
      color:#1e3a8a;
      border-radius:20px;
      padding:18px 22px;
      text-align:center;
      font-size:14px;
      line-height:1.45;
      font-weight:800;
      box-shadow:0 10px 28px rgba(2,8,23,.065);
    }

    .website-video-note a{
      color:#1d4ed8;
      text-decoration:underline;
      font-weight:950;
    }

    .about-page{
      justify-content:center;
      align-items:stretch;
      background:#fff;
    }

    .about-grid{
      width:100%;
      display:grid;
      grid-template-columns:300px 1fr;
      gap:26px;
      align-items:center;
    }

    .about-photo{
      width:300px;
      height:410px;
      object-fit:cover;
      object-position:center 18%;
      border-radius:24px;
      box-shadow:var(--shadow);
      background:#fff;
    }

    .about-card{
      background:#f8fafc;
      border-radius:24px;
      padding:22px;
      box-shadow:0 12px 34px rgba(2,8,23,.08);
    }

    .about-card h2{
      font-size:34px;
      line-height:1;
      margin:0 0 12px;
      letter-spacing:-1px;
      font-weight:950;
    }

    .about-card p{
      margin:0;
      font-size:13.3px;
      line-height:1.58;
      color:#334155;
      font-weight:560;
    }

    .involvement-grid{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:10px;
    }

    .involvement-item{
      display:grid;
      grid-template-columns:55px 1fr;
      gap:10px;
      align-items:center;
      background:#fff;
      border-radius:16px;
      padding:9px;
      box-shadow:0 8px 22px rgba(2,8,23,.055);
    }

    .involvement-item img{
      width:55px;
      height:45px;
      object-fit:cover;
      border-radius:12px;
      background:#fff;
    }

    .involvement-title{
      font-size:10.7px;
      line-height:1.18;
      font-weight:950;
      color:#0f172a;
    }

    .involvement-date{
      font-size:8.2px;
      line-height:1.2;
      font-weight:850;
      color:#2563eb;
      margin-top:2px;
    }

    .involvement-text{
      font-size:9.4px;
      line-height:1.32;
      font-weight:560;
      color:#475569;
      margin-top:3px;
    }

    .closing-card{
      width:8.8in;
      background:rgba(255,255,255,.92);
      border-radius:30px;
      padding:38px 46px;
      box-shadow:0 24px 80px rgba(0,0,0,.30);
      color:#0f172a;
      text-align:center;
    }

    .closing-card h1{
      font-size:46px;
      line-height:1;
      margin:0 0 12px;
      letter-spacing:-1.5px;
      font-weight:950;
    }

    .closing-card p{
      font-size:15px;
      line-height:1.58;
      color:#334155;
      font-weight:600;
      margin:0 auto 20px;
      max-width:7.2in;
    }

    .contact-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px 16px;
      margin-top:16px;
      text-align:left;
    }

    .contact-item{
      background:#f8fafc;
      border-radius:15px;
      padding:11px 13px;
      overflow:hidden;
    }

    .contact-label{
      font-size:9px;
      font-weight:950;
      letter-spacing:.13em;
      text-transform:uppercase;
      color:#64748b;
      margin-bottom:4px;
    }

    .contact-value{
      font-size:12.2px;
      line-height:1.25;
      font-weight:850;
      color:#0f172a;
      word-break:break-word;
    }

    .contact-value a{
      color:#1d4ed8;
      text-decoration:none;
    }

    .error-box{
      width:8.4in;
      background:#fff1f2;
      border-radius:22px;
      padding:24px;
      color:#9f1239;
      font-weight:800;
      line-height:1.45;
    }

    @media print{
      .pdf-actions{
        display:none !important;
      }

    function escapeHtml(value){
      return String(value || "").replace(/[&<>"']/g, function(match){
        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[match];
      });
    }

    function isVideo(src){
      return String(src || "").toLowerCase().split("?")[0].endsWith(".mp4");
    }

    function hasVideos(images){
      return (Array.isArray(images) ? images : [])
        .filter(Boolean)
        .some(src => isVideo(src));
    }

    function onlyImages(images){
      return (Array.isArray(images) ? images : [])
        .filter(Boolean)
        .filter(src => !isVideo(src))
        .slice(0, 4);
    }

    function mediaBox(src, alt, extraClass = ""){
      if(!src) return "";

      if(isVideo(src)){
        return "";
      }

      return `
        <div class="project-img-box ${extraClass}">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" crossorigin="anonymous">
        </div>
      `;
    }

    function imageStack(images, alt){
      return `
        <div class="image-stack">
          ${images.map(src => mediaBox(src, alt)).join("")}
        </div>
      `;
    }

    function skillPills(skills){
      return String(skills || "")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean)
        .slice(0, 16)
        .map(s => `<span class="skill-pill">${escapeHtml(s)}</span>`)
        .join("");
    }

    function flattenProjectPages(projects){
      const pages = [];

        .forEach(project => {
          if(Array.isArray(project.subsections) && project.subsections.length){
            project.subsections.forEach((sub, index) => {
              const letter = String.fromCharCode(97 + index);
              pages.push({
                id:`project-${project.number}${letter}`,
                projectNumber:project.number,
                navTitle:`Project ${project.number}${letter}: ${sub.title}`,
                displayNumber:`Project ${project.number}${letter}`,
                title:sub.title,
                skills:sub.skills || project.skills,
                contextLabel:sub.contextLabel || project.contextLabel || "What / Context",
                context:sub.context || project.context || "",
                howLabel:sub.howLabel || project.howLabel || "How / Tools",
                how:sub.how || project.how || "",
                resultsLabel:sub.resultsLabel || project.resultsLabel || "Results / Outcomes",
                results:sub.results || project.results || "",
                images:Array.isArray(sub.images) ? sub.images : []
              });
            });
          } else {
            pages.push({
              id:`project-${project.number}`,
              projectNumber:project.number,
              navTitle:`Project ${project.number}: ${project.title}`,
              displayNumber:`Project ${project.number}`,
              title:project.title,
              skills:project.skills,
              contextLabel:project.contextLabel || "What / Context",
              context:project.context || "",
              howLabel:project.howLabel || "How / Tools",
              how:project.how || "",
              resultsLabel:project.resultsLabel || "Results / Outcomes",
              results:project.results || "",
              images:Array.isArray(project.images) ? project.images : []
            });
          }
        });

      return pages;
    }

    function renderProjectSevenPage(projectPage, images){
      const firstTwo = [images[0], images[1]].filter(Boolean);
      const rightResultImg = images[2] || "";
      const leftResultImg = images[3] || "";

      return `
        <section class="page project-page project-7" id="${escapeHtml(projectPage.id)}">
          <div class="project-header">
            <div class="project-number">${escapeHtml(projectPage.displayNumber)}</div>
            <h1 class="project-title">${escapeHtml(projectPage.title)}</h1>

            <div class="skill-row">
              ${skillPills(projectPage.skills)}
            </div>
          </div>

          <div class="project-main-stacked">
            <div class="text-box">
              <div class="text-section">
                <div class="label">${escapeHtml(projectPage.contextLabel)}</div>
                <div class="body-text">${escapeHtml(projectPage.context)}</div>
              </div>

              <div class="text-section">
                <div class="label">${escapeHtml(projectPage.howLabel)}</div>
                <div class="body-text">${escapeHtml(projectPage.how)}</div>
              </div>
            </div>

            ${imageStack(firstTwo, projectPage.title)}
          </div>

          <div class="project-7-lower">
            ${mediaBox(leftResultImg, projectPage.title)}

            <div class="text-box">
              <div class="text-section">
                <div class="label">${escapeHtml(projectPage.resultsLabel)}</div>
                <div class="body-text">${escapeHtml(projectPage.results)}</div>
              </div>
            </div>

            ${mediaBox(rightResultImg, projectPage.title)}
          </div>
        </section>
      `;
    }

    function renderProjectPage(projectPage){
      const images = onlyImages(projectPage.images);
      const videoOnly = images.length === 0 && hasVideos(projectPage.images);

      if(videoOnly){
        return renderTextOnlyProject(projectPage);
      }

      if(images.length === 0){
        return renderTextOnlyProject(projectPage);
      }

      if(projectPage.projectNumber === 1){
        return renderProjectOnePage(projectPage, images);
      }

      if(projectPage.projectNumber === 4 && images.length >= 4){
        return renderProjectFourPage(projectPage, images);
      }

      if(projectPage.projectNumber === 6 && images.length >= 3){
        return renderProjectSixPage(projectPage, images);
      }

      if(projectPage.projectNumber === 7 && images.length >= 4){
        return renderProjectSevenPage(projectPage, images);
      }

      if(images.length === 1){
        return renderOneImageProjectPage(projectPage, images);
      }

      if(images.length === 2){
        return renderTwoImageProjectPage(projectPage, images);
      }

      if(images.length === 3){
        return renderThreeImageProjectPage(projectPage, images);
      }

      return renderFourImageProjectPage(projectPage, images);
    }

    function renderAboutPage(){
      return `
        <section class="page about-page" id="page-about">
          <div class="about-grid">
            <img class="about-photo" src="assets/images/heasshot9.jpg" alt="Michael Gauthier about page photo">

            <div class="about-card">
              <h2>About Me</h2>
              <p>${escapeHtml(aboutPageBlurb)}</p>

              <div class="involvement-grid">
                ${involvementItems.map(item => `
                  <div class="involvement-item">
                    <img src="${escapeHtml(item.img)}" alt="${escapeHtml(item.title)}">
                    <div>
                      <div class="involvement-title">${escapeHtml(item.title)}</div>
                      <div class="involvement-date">${escapeHtml(item.date)}</div>
                      <div class="involvement-text">${escapeHtml(item.text)}</div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderClosingPage(){
      return `
        <section class="page full-bg" id="page-contact">
          <img class="page-bg-img" src="assets/images/ProjectBanner.jpg" alt="">
          <div class="page-bg-overlay"></div>

          <div class="page-content">
            <div class="closing-card">
              <h1>Thank you for reading.</h1>

              <p>
                I’m currently looking for mechanical engineering co-op opportunities where I can keep building practical engineering experience through design, CAD, testing, automation, manufacturing, and hands-on problem solving. I’m always happy to connect, talk through my work, or share more about any project in this portfolio.
              </p>

              <div class="contact-grid">
                <div class="contact-item">
                  <div class="contact-label">Phone</div>
                  <div class="contact-value">${escapeHtml(PHONE)}</div>
                </div>

                <div class="contact-item">
                  <div class="contact-label">Email</div>
                  <div class="contact-value">
                    <a href="mailto:${escapeHtml(EMAIL)}">${escapeHtml(EMAIL)}</a>
                  </div>
                </div>

                <div class="contact-item">
                  <div class="contact-label">LinkedIn</div>
                  <div class="contact-value">
                    <a href="${escapeHtml(LINKEDIN)}">${escapeHtml(LINKEDIN)}</a>
                  </div>
                </div>

                <div class="contact-item">
                  <div class="contact-label">Portfolio Website</div>
                  <div class="contact-value">
                    <a href="${escapeHtml(PORTFOLIO)}">${escapeHtml(PORTFOLIO)}</a>
                  </div>
                </div>

                <div class="contact-item">
                  <div class="contact-label">Location</div>
                  <div class="contact-value">${escapeHtml(LOCATION)}</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function buildPortfolio(){
      const root = document.getElementById("pdfPortfolio");

      if(!window.PROJECTS || !Array.isArray(window.PROJECTS)){
        root.innerHTML = `
          <section class="page">
            <div class="error-box">
              projects-data.js did not load. Make sure print.html is in the same root folder as projects-data.js.
            </div>
          </section>
        `;
        return;
      }

      const projectPages = flattenProjectPages(window.PROJECTS);

      const navItems = [
        { id:"page-title", title:"Title Page" },
        { id:"page-index", title:"Index" },
        { id:"page-timeline", title:"Timeline" },
        ...projectPages.map(p => ({ id:p.id, title:p.navTitle })),
        { id:"page-about", title:"About Me" },
        { id:"page-contact", title:"Closing / Contact Me" }
      ];

      root.innerHTML = [
        renderCoverPage(),
        renderIndexPage(navItems),
        renderTimelinePage(),
        ...projectPages.map(renderProjectPage),
        renderAboutPage(),
        renderClosingPage()
      ].join("");
    }

    async function waitForImages(){
      const imgs = Array.from(document.images);
      await Promise.all(imgs.map(img => {
        if(img.complete) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));
    }

    async function downloadPortfolioPdf(){
      const button = document.getElementById("downloadPdfBtn");
      button.textContent = "Preparing PDF...";
      button.disabled = true;

      await waitForImages();

      const element = document.getElementById("pdfPortfolio");

      const options = {
        margin:0,
        filename:"Michael-Gauthier-Engineering-Portfolio.pdf",
        image:{
          type:"jpeg",
          quality:0.98
        },
        html2canvas:{
          scale:2,
          useCORS:true,
          allowTaint:true,
          backgroundColor:"#ffffff",
          logging:false,
          scrollX:0,
          scrollY:0,
          windowWidth:1122,
          windowHeight:794
        },
        jsPDF:{
          unit:"in",
          format:"letter",
          orientation:"landscape",
          compress:true
        },
        pagebreak:{
          mode:["css", "legacy"],
          before:".page"
        },
        enableLinks:true
      };

      html2pdf()
        .set(options)
        .from(element)
        .save()
        .then(() => {
          button.textContent = "Download PDF";
          button.disabled = false;
        })
        .catch(() => {
          button.textContent = "Try Again";
          button.disabled = false;
          alert("The PDF did not generate. Check that all image paths are correct and that this file is being run from your GitHub Pages site, not opened directly from your computer.");
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
      buildPortfolio();
      document.getElementById("downloadPdfBtn").addEventListener("click", downloadPortfolioPdf);
    });
  </script>
</body>
</html>
