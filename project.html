<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Project | Michael Gauthier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=99" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brandblock">
        <div class="brand">Michael Gauthier</div>
        <div class="subtitle">Mechanical Engineering Student</div>
      </div>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resume.html">Resume</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="contact.html">Contact</a>
        <a class="icon-link" href="mailto:gauthier.mi@northeastern.edu" aria-label="Email">✉</a>
        <a class="icon-link" href="https://www.linkedin.com/in/mgauthier1" target="_blank" rel="noopener" aria-label="LinkedIn">in</a>
      </nav>
    </div>
  </header>

  <main class="surface">
    <section class="wrap section">
      <div class="actions">
        <a class="btn" href="projects.html">Back to projects</a>
      </div>

      <div id="projectWrap"></div>

      <footer class="footer">
        <div class="wrap footer-3">
          <div class="footer-left">
            <a href="mailto:gauthier.mi@northeastern.edu">gauthier.mi@northeastern.edu</a>
            <span class="sep">|</span>
            <a href="https://www.linkedin.com/in/mgauthier1" target="_blank" rel="noopener">LinkedIn</a>
          </div>
          <div class="footer-center">Michael Gauthier Engineering Portfolio</div>
          <div class="footer-right">© <span id="year"></span></div>
        </div>
      </footer>
    </section>
  </main>

  <script src="projects-data.js?v=99"></script>
  <script src="script.js?v=99"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    const items = (window.PROJECTS || []);
    const p = items.find(x => x.slug === slug);

    const root = document.getElementById("projectWrap");

    if (!p) {
      root.innerHTML = `
        <div class="card" style="padding:18px;">
          <div class="h2">Project not found</div>
          <p class="p-muted">Go back to Projects and try again.</p>
        </div>
      `;
    } else {
      document.title = `${p.number}. ${p.title} | Michael Gauthier`;

      const gallery = (p.images || []).map(src => `
        <div class="card" style="overflow:hidden;">
          <img src="${src}" alt="${p.title}" loading="lazy" style="width:100%; height:auto;">
        </div>
      `).join("");

      root.innerHTML = `
        <div class="card" style="padding:18px;">
          <div style="font-weight:900; font-size:22px;">${p.number}. ${p.title}</div>

          <div style="margin-top:14px;">
            <div style="font-weight:900;">${p.skillsLabel}</div>
            <div style="margin-top:6px; color: rgba(11,18,32,.72); line-height:1.6;">${p.skills}</div>
          </div>

          <div style="margin-top:18px;">
            <div style="font-weight:900;">${p.contextLabel}</div>
            <div style="margin-top:6px; color: rgba(11,18,32,.72); line-height:1.7;">${p.context}</div>
          </div>

          <div style="margin-top:18px;">
            <div style="font-weight:900;">${p.howLabel}</div>
            <div style="margin-top:6px; color: rgba(11,18,32,.72); line-height:1.7;">${p.how}</div>
          </div>

          <div style="margin-top:18px;">
            <div style="font-weight:900;">${p.resultsLabel}</div>
            <div style="margin-top:6px; color: rgba(11,18,32,.72); line-height:1.7;">${p.results}</div>
          </div>
        </div>

        <div style="margin-top:18px;">
          <div class="h2">Photos</div>
          <div class="projects-grid" style="grid-template-columns: repeat(2, 1fr); margin-top:12px;">
            ${gallery || `<div class="p-muted">Add images later to assets/images/project${p.number}.jpg</div>`}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
