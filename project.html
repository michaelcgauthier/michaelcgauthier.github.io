<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Project | Michael Gauthier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=999" />
</head>

<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brandblock">
        <div class="brand">Michael Gauthier</div>
        <div class="subtitle">Mechanical Engineering Student</div>
      </div>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="projects.html">Projects</a>
        <a class="nav-link" href="resume.html">Resume</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="contact.html">Contact</a>
        <a class="icon-link" href="mailto:gauthier.mi@northeastern.edu" aria-label="Email">✉</a>
        <a class="icon-link" href="https://www.linkedin.com/in/mgauthier1" target="_blank" rel="noopener" aria-label="LinkedIn">in</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero project-hero" style="--hero-bg: url('assets/images/all/ProjectsBannerBackground.png');" data-parallax="true" data-parallax-speed="0.10" data-parallax-scale="1.10">
      <div class="hero-overlay"></div>
      <div class="wrap hero-content">
        <div class="hero-center">
          <h1 id="projectHeroTitle" class="hero-title project-hero-title"></h1>
        </div>
      </div>
    </section>

    <section class="surface">
      <div class="wrap section">
        <div class="actions" style="margin-bottom:14px;">
          <a class="btn" href="projects.html">Back to projects</a>
        </div>

        <div id="projectWrap"></div>

        <footer class="footer">
          <div class="wrap footer-3">
            <div class="footer-left">
              <a href="mailto:gauthier.mi@northeastern.edu">gauthier.mi@northeastern.edu</a>
              <span class="sep">|</span>
              <a href="https://www.linkedin.com/in/mgauthier1" target="_blank" rel="noopener">LinkedIn</a>
            </div>
            <div class="footer-center">Michael Gauthier Engineering Portfolio</div>
            <div class="footer-right">© <span id="year"></span></div>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="projects-data.js?v=999"></script>
  <script src="script.js?v=999"></script>

  <script>
    (function(){
      const root = document.getElementById("projectWrap");
      const heroTitle = document.getElementById("projectHeroTitle");
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      if (!window.PROJECTS) {
        heroTitle.textContent = "Project";
        root.innerHTML = `
          <div class="card" style="padding:18px;">
            <div class="h2">Projects data not loading</div>
            <p class="p-muted" style="margin-top:10px;">
              projects-data.js did not run. This usually means the script path is wrong or there is a syntax error inside projects-data.js.
            </p>
          </div>
        `;
        return;
      }

      if (!slug) {
        heroTitle.textContent = "Project";
        root.innerHTML = `
          <div class="card" style="padding:18px;">
            <div class="h2">No project selected</div>
            <p class="p-muted" style="margin-top:10px;">
              This page needs a URL like: project.html?slug=project-1
            </p>
          </div>
        `;
        return;
      }

      const projects = window.PROJECTS.slice().sort((a,b)=>a.number-b.number);
      const p = projects.find(x => x.slug === slug);

      if (!p) {
        heroTitle.textContent = "Project";
        root.innerHTML = `
          <div class="card" style="padding:18px;">
            <div class="h2">Project not found</div>
            <p class="p-muted" style="margin-top:10px;">
              Could not find a project with slug: <b>${slug}</b>
            </p>
          </div>
        `;
        return;
      }

      document.title = `${p.title} | Michael Gauthier`;
      heroTitle.textContent = p.title;

      const imgMain = `assets/images/project${p.number}.jpg`;

      function pillsFromSkills(skillsStr){
        const list = (skillsStr || "")
          .split(",")
          .map(s => s.trim())
          .filter(Boolean)
          .slice(0, 10);

        return list.map(s => `<span class="project-skill-pill">${s}</span>`).join("");
      }

      function renderTile(title, skills, contextLabel, context, howLabel, how, resultsLabel, results){
        const pills = pillsFromSkills(skills);

        return `
          <div class="project-detail card" style="padding:18px; margin-bottom:16px;">
            <div style="font-weight:900; font-size:20px; text-align:center; letter-spacing:.2px; margin: 6px 0 14px;">
              ${title}
            </div>

            <div class="project-detail-top" style="display:grid; grid-template-columns: 1fr 320px; gap:18px; align-items:start;">
              <div>
                <div class="project-skill-pills" style="margin-top:10px;">
                  ${pills}
                </div>

                <div style="margin-top:16px;">
                  <div class="project-detail-label">${contextLabel}</div>
                  <div class="project-detail-body">${context}</div>
                </div>

                <div style="margin-top:16px;">
                  <div class="project-detail-label">${howLabel}</div>
                  <div class="project-detail-body">${how}</div>
                </div>
              </div>

              <div class="project-detail-photo" style="overflow:hidden; border-radius:14px; border:1px solid rgba(2,8,23,.10); background:#fff; box-shadow: 0 14px 36px rgba(2,8,23,.10);">
                <img src="${imgMain}" alt="${title}" loading="lazy" style="width:100%; height:auto; display:block;">
                <div class="project-detail-photo-note" style="padding:10px 12px; font-size:12.5px; color: rgba(11,18,32,.62); border-top: 1px solid rgba(2,8,23,.08);">
                  Add image later at: ${imgMain}
                </div>
              </div>
            </div>

            <div class="project-detail-results" style="margin-top:18px; padding-top:18px; border-top:1px solid rgba(2,8,23,.08);">
              <div class="project-detail-label">${resultsLabel}</div>
              <div class="project-detail-body">${results}</div>
            </div>
          </div>
        `;
      }

      if (Array.isArray(p.subsections) && p.subsections.length > 0) {
        const tiles = p.subsections.map(s => renderTile(
          s.title,
          s.skills,
          s.contextLabel,
          s.context,
          s.howLabel,
          s.how,
          s.resultsLabel,
          s.results
        )).join("");

        root.innerHTML = tiles;
      } else {
        root.innerHTML = renderTile(
          p.title,
          p.skills,
          p.contextLabel,
          p.context,
          p.howLabel,
          p.how,
          p.resultsLabel,
          p.results
        );
      }

      const mq = window.matchMedia("(max-width: 720px)");
      if (mq.matches) {
        const tops = root.querySelectorAll(".project-detail-top");
        tops.forEach(t => t.style.gridTemplateColumns = "1fr");
      }
    })();
  </script>
</body>
</html>
